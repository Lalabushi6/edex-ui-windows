<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Served from app://edex, so 'self' is the bundled renderer only. Local
       files for previews come through the read-only localfile: protocol.
       Inline styles stay allowed because xterm.js injects <style> elements;
       scripts are never inline. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: localfile:;
    media-src 'self' localfile:;
    frame-src localfile:;
    font-src 'self';
    connect-src 'self';
    object-src 'none';
    base-uri 'none';
    form-action 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eDEX-UI</title>
  <link rel="stylesheet" href="vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/workspace.css">
  <link rel="stylesheet" href="css/overlays.css">
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <aside id="col-left" class="side" aria-label="System panels">
      <div class="col-title"><span>PANEL</span><span>SYSTEM</span></div>
      <div class="column" id="col-left-body"></div>
    </aside>
    <section id="work">
      <div class="col-title"><span id="work-title-a">TERMINAL</span><span id="work-title-b">MAIN SHELL</span></div>
      <main id="workspace" class="frame"></main>
    </section>
    <aside id="col-right" class="side" aria-label="Network and tools">
      <div class="col-title"><span>PANEL</span><span>NETWORK</span></div>
      <div class="column" id="col-right-body"></div>
    </aside>
    <div id="bottom" hidden>
      <section id="filepanel" aria-label="File browser" hidden></section>
      <section id="keyboard" aria-label="On-screen keyboard"></section>
    </div>
    <footer id="dock"></footer>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <!-- Keeps the media element attached to the document (so playback
       continues) while the media player tab is closed or hidden. -->
  <div id="media-host" hidden></div>

  <div id="boot">
    <div class="boot-log" id="boot-log"></div>
    <div class="boot-title" id="boot-title" hidden>
      <h1 id="boot-logo" data-text="eDEX-UI">eDEX-UI</h1>
      <div class="boot-sub" id="boot-sub">WINDOWS EDITION</div>
    </div>
    <div class="boot-skip">PRESS ANY KEY TO SKIP</div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
