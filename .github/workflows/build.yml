# Builds the Windows installer and portable .exe on every push and pull
# request (as a check), and publishes them as a GitHub Release when a version
# tag such as v2.0.0 is pushed.
#
# GitHub's artifact storage allowance is small (500 MB per account on the
# free plan) and one build is about 200 MB, so
# the executables are only kept as downloadable artifacts when you start a
# build by hand (Actions → Build → Run workflow), for a few days. Release
# files don't count against it.
#
# Pull requests from forks build with a read-only token (GitHub's default
# for the pull_request event), so they can't publish anything.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      artifacts:
        description: "Keep the .exe files as downloadable artifacts (3 days)"
        type: boolean
        default: true

# A newer push to the same branch replaces a build still running; release
# builds always finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check sources
        run: npm run check

      - name: Build installer and portable exe
        run: npm run dist

      # Each file on its own and unzipped, so it downloads as the .exe itself.
      # A full storage quota doesn't fail the build.
      - name: Upload installer
        if: github.event_name == 'workflow_dispatch' && inputs.artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: dist/eDEX-UI-Setup.exe
          archive: false
          retention-days: 3
          if-no-files-found: error

      - name: Upload portable exe
        if: github.event_name == 'workflow_dispatch' && inputs.artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: dist/eDEX-UI-Portable.exe
          archive: false
          retention-days: 3
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/eDEX-UI-Setup.exe
            dist/eDEX-UI-Portable.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
