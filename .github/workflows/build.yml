# Builds the Windows installer and portable .exe on every push and pull
# request (as a check), and publishes them as a GitHub Release when a version
# tag such as v2.0.0 is pushed.
#
# GitHub's artifact storage allowance is small (500 MB per account on the
# free plan) and one build is about 200 MB, so
# the executables are only kept as downloadable artifacts when you start a
# build by hand (Actions → Build → Run workflow), for a few days. Release
# files don't count against it.
#
# Pull requests from forks build with a read-only token (GitHub's default
# for the pull_request event), so they can't publish anything.
#
# Actions are pinned to commits, because a tag can be moved to different code.
# Dependabot keeps the pins and their version comments up to date.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      artifacts:
        description: "Keep the .exe files as downloadable artifacts (3 days)"
        type: boolean
        default: true

# A newer push to the same branch replaces a build still running; release
# builds always finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # No later step needs Git credentials, so the token isn't left on disk
      # for build steps to find.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check sources
        run: npm run check

      # Starts the app on a throwaway profile and clicks through its main
      # parts (scripts/smoke.js). Informational for now: a failure shows in
      # the run but doesn't stop the build or a release.
      - name: Smoke test
        run: npm run smoke
        continue-on-error: true
        timeout-minutes: 6

      - name: Build installer and portable exe
        run: npm run dist

      # Each file on its own and unzipped, so it downloads as the .exe itself.
      # A full storage quota doesn't fail the build.
      - name: Upload installer
        if: github.event_name == 'workflow_dispatch' && inputs.artifacts
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/eDEX-UI-Setup.exe
          archive: false
          retention-days: 3
          if-no-files-found: error

      - name: Upload portable exe
        if: github.event_name == 'workflow_dispatch' && inputs.artifacts
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/eDEX-UI-Portable.exe
          archive: false
          retention-days: 3
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/eDEX-UI-Setup.exe
            dist/eDEX-UI-Portable.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
